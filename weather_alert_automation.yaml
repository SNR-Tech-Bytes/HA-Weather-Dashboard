alias: Weather Alert for Home
description: >-
  If no conversation agent is set (agent_id left blank/removed), this skips
  AI summarization and falls back to the raw alert text — see the README.
triggers:
  - entity_id:
      - sensor.YOUR_NWS_ALERTS_ENTITY
    trigger: state
conditions:
  - condition: template
    value_template: '{{ trigger.to_state.state | int(0) > trigger.from_state.state | int(0) }}'
actions:
  - variables:
      alert_text: >
        {% set ns = namespace(text="") %} {% for alert in
        trigger.to_state.attributes.Alerts %} {% set ns.text = ns.text ~ "Event:
        " ~ alert.Event ~
           "\nSeverity: " ~ alert.Severity ~
           "\nHeadline: " ~ alert.Headline ~ "\nDescription: " ~ alert.Description ~
           "\nInstructions: " ~ (alert.Instruction or "None") ~ "\n\n" %}
        {% endfor %} {{ ns.text }}
      is_critical: |-
        {{ trigger.to_state.attributes.Alerts
           | selectattr('NWSCode', 'in', ['HWW','HUW','SVR','TOR','TSW','WSW','EQW','EVI','RHW','SPW','AVW','VOW'])
           | list | count > 0 }}
  # AI summarization (optional). continue_on_error means a missing/misconfigured
  # agent won't stop the automation — it just falls through to the raw alert
  # text below instead of a nicer summary.
  - action: conversation.process
    continue_on_error: true
    data:
      text: >
        Summarize the following NWS alert(s) for a homeowner in 2-3 concise
        sentences. Prioritize any immediate safety actions.

        {{ alert_text }}
      agent_id: conversation.YOUR_CONVERSATION_AGENT
    response_variable: ai_response
  - variables:
      summary_text: >-
        {% if ai_response is defined and ai_response.response is defined
           and ai_response.response.speech is defined %}
          {{ ai_response.response.speech.plain.speech }}
        {% else %}
          {{ alert_text }}
        {% endif %}
  - event: weather_alert_summary_updated
    event_data:
      summary: '{{ summary_text }}'
  - choose:
      - conditions:
          - condition: template
            value_template: '{{ is_critical }}'
        sequence:
          - action: notify.YOUR_MOBILE_APP_NOTIFY_SERVICE
            data:
              title: 🚨 CRITICAL Weather Alert for Home
              message: '{{ summary_text }}'
              data:
                url: /YOUR-DASHBOARD-PATH
                push:
                  sound:
                    name: default
                    critical: 1
                    volume: 1
      default:
      - action: notify.YOUR_MOBILE_APP_NOTIFY_SERVICE
        data:
          title: Weather Alert for Home
          message: '{{ summary_text }}'
          data:
            url: /YOUR-DASHBOARD-PATH
            push:
              interruption-level: time-sensitive
