# Home Assistant package: Weather Alert Summary sensor
#
# Install:
#   1. Enable packages in configuration.yaml (if not already):
#        homeassistant:
#          packages: !include_dir_named packages
#   2. Save this file as homeassistant/packages/weather-alert-package.yaml
#   3. Fill in the placeholder below with your own NWS alerts entity.
#   4. Restart Home Assistant (full restart only needed the first time you
#      add the packages: line above — after that, reload Template Entities
#      from Developer Tools → YAML).
#
# After setup, use this sensor's entity in the dashboard's markdown card
# and in the weather-alert-automation.yaml automation:
#   sensor.weather_alert_summary

template:
  - trigger:
      - trigger: event
        event_type: weather_alert_summary_updated
      - trigger: state
        entity_id: sensor.YOUR_NWS_ALERTS_ENTITY
        to: "0"
    sensor:
      - name: "Weather Alert Summary"
        unique_id: weather_alert_summary
        state: "{{ now().isoformat() }}"
        attributes:
          full_text: >-
            {% if trigger.event is defined %}
              {{ trigger.event.data.summary }}
            {% else %}
              No active alerts.
            {% endif %}
